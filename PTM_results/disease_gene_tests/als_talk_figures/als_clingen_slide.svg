   <g id="text_16">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="595.0512" y="112.8" transform="rotate(-0 595.0512 112.8)">All 42 ClinGen disease panels</text>
