  <g id="text_17">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3f7a" x="43.1892" y="45.9" transform="rotate(-0 43.1892 45.9)">72% of ALS-causing proteins are arginine-methylated</text>
  </g>
  <g id="text_18">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="43.1892" y="74.52" transform="rotate(-0 43.1892 74.52)">Most of any disease group: ALS ranks 1st of 42 ClinGen curation panels.</text>
  </g>
  <g id="text_19">
   <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(43.1892 498.295547)">ClinGen gene–disease validity (Definitive/Strong/Moderate; panels ≥10 proteins). Methylated = any arginine-methylation site in the PTM_pipeline union. Adjusted for RNA</text>
   <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(43.1892 509.698145)">binding, length and abundance, ALS odds ratio 3.0 (95% CI 1.3–7.4). Methylated ALS proteins: ALS2, ANXA11, AR, ATXN2, CHMP2B, DCTN1, FUS, HNRNPA2B1, KIF5A, LRP12, MATR3, NEK1,</text>
   <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(43.1892 521.1)">PFN1, SOD1, SPTLC2, SQSTM1, TARDBP, TUBA4A, UBQLN2, VAPB, VCP.</text>
  </g>
 </g>
