  </g>
  <g id="text_27">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="31.68" y="51.336" transform="rotate(-0 31.68 51.336)">Disease Ontology enrichment (DOSE) of 4,687 methylarginine genes against an MS-detectable background. Top 10 terms, plus ALS.</text>
  </g>
  <g id="text_28">
