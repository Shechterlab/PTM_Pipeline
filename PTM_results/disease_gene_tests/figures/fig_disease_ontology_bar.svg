  </g>
  <g id="text_29">
   <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(554.4 144.829336)">TAF15  EWSR1  FUS  HNRNPA1</text>
   <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(554.4 159.004336)">BPTF  MATR3  DYNC1H1  SPTAN1</text>
