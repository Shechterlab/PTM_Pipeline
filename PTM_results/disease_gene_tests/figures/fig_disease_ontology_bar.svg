  <g id="text_30">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="554.4" y="223.276116" transform="rotate(-0 554.4 223.276116)">+ 62 more (ordered by site count)</text>
  </g>
  <g id="text_31">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(554.4 248.623484)">Fold enrichment 1.33. Background: 5,554 DO-</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(554.4 259.185891)">annotated genes detected by MS in human cell</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(554.4 269.748297)">lines (PaxDb 5.0) or carrying a methylarginine</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(554.4 280.310703)">site, so only proteins that could have been</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(554.4 290.873109)">seen are counted.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="31.68" y="408.456" transform="rotate(-0 31.68 408.456)">Motor neuron disease: rank 8 of 864 (p = 0.0006; FDR 0.06). ALS: rank 18 (p = 0.004; FDR 0.19). Top terms are developmental and intellectual-disability terms.</text>
  </g>
  <g id="text_33">
   <text style="font-style: italic; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(31.68 419.181867)">DOSE 4.6 enrichDO (BH). Methylarginine: PTM_pipeline site union (Maron 2021 Table S5, PRoMetheusDB, curated PTM databases; any evidence). Background: PaxDb 5.0 cell-line</text>
   <text style="font-style: italic; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(31.68 428.544)">proteomes (Geiger 2012; Nagaraj 2011; Kulak 2014; Müller 2020).</text>
  </g>
