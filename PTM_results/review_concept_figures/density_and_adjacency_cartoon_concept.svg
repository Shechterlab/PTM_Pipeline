<rect x="0" y="0" width="1360" height="920" fill="#FFFFFF" stroke="none" />
<text x="52" y="52" fill="#1A2433" font-size="24" text-anchor="start" font-weight="700">Cartoon options for local methylarginine density and structured-domain adjacency</text>
<text x="52" y="80" fill="#637083" font-size="13" text-anchor="start" font-weight="600">Use these as small review-style insets: one defines clustering by site spacing, the other defines distance from the nearest ordered-domain edge.</text>
<rect x="52" y="104" width="168" height="32" rx="16" fill="#F5F8FB" stroke="#D9E1EA" stroke-width="1" />
<text x="136" y="125" fill="#637083" font-size="11.4" text-anchor="middle" font-weight="600">same site chemistry</text>
<rect x="242" y="104" width="171" height="32" rx="16" fill="#F5F8FB" stroke="#D9E1EA" stroke-width="1" />
<text x="327.5" y="125" fill="#637083" font-size="11.4" text-anchor="middle" font-weight="600">same total site count</text>
<rect x="446" y="104" width="185" height="32" rx="16" fill="#F5F8FB" stroke="#D9E1EA" stroke-width="1" />
<text x="538.5" y="125" fill="#637083" font-size="11.4" text-anchor="middle" font-weight="600">spacing defines density</text>
<rect x="646" y="104" width="290" height="32" rx="16" fill="#F5F8FB" stroke="#D9E1EA" stroke-width="1" />
<text x="791" y="125" fill="#637083" font-size="11.4" text-anchor="middle" font-weight="600">domain-edge distance defines adjacency</text>
<text x="52" y="162" fill="#1A2433" font-size="18" text-anchor="start" font-weight="700">Local density cartoon</text>
<text x="52" y="183" fill="#637083" font-size="11.8" text-anchor="start" font-weight="600">Keep the IDR loose and schematic; use a bracketed span, not a box, to avoid looking like an ordered domain.</text>
<text x="72" y="216" fill="#1A2433" font-size="18" text-anchor="start" font-weight="700">Diffuse spacing</text>
<text x="72" y="239" fill="#637083" font-size="11.7" text-anchor="start" font-weight="600">Same total number of methyl-sites, but spread across the IDR.</text>
