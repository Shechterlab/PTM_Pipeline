<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Methylarginine mark: the guanidinium group of arginine — the side-chain
    carbon with its three nitrogens — carrying its delocalised positive
    charge, with the two methylated nitrogens picked out in orange.

    Built to survive 16px: three thick strokes, two large filled dots and a
    plus. The "+" is drawn as two strokes rather than set as text, so the
    file does not depend on a font being installed. Colours match the lab
    site: teal #155e75, orange #f97316.
  -->
  <rect width="32" height="32" rx="7" fill="#155e75"/>
  <g stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M16,26 L16,17"/>
    <path d="M16,17 L9,12.6"/>
    <path d="M16,17 L23,12.6"/>
    <path d="M16,5.5 L16,10.5" stroke-width="2.4"/>
    <path d="M13.5,8 L18.5,8" stroke-width="2.4"/>
  </g>
  <circle cx="9" cy="12.6" r="4" fill="#f97316"/>
  <circle cx="23" cy="12.6" r="4" fill="#f97316"/>
</svg>
