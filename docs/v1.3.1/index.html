<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved to PTMcontext</title>
  <!-- The Methylarginine Site Explorer is PTMcontext's methylarginine explorer (owner's decision, 20 November 2026). A link to a
       protein here (#P35637, #P35637/R216) opens that protein there (#/protein/P35637). -->
  <link rel="canonical" href="https://shechterlab.github.io/ptmcontext/methylarginine/">
  <script>
    (function () {
      var base = 'https://shechterlab.github.io/ptmcontext/methylarginine/';
      var acc = /^([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9](?:[A-Z][A-Z0-9]{2}[0-9]){1,2})(?:-\d+)?(?:\/|$)/;
      var h = location.hash.slice(1);
      try { h = decodeURIComponent(h); } catch (e) {}
      var m = acc.exec(h);
      location.replace(base + (m ? '#/protein/' + encodeURIComponent(m[1]) : ''));
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://shechterlab.github.io/ptmcontext/methylarginine/">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 2rem 1rem; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; background: #ffffff; color: #1d2a30; }
    a { color: #0b3d91; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) { body { background: #12191d; color: #e6edf0; } a { color: #8ab4f8; } }
  </style>
</head>
<body>
  <p><strong>Moved to PTMcontext.</strong> The Methylarginine Site Explorer is now
    <a href="https://shechterlab.github.io/ptmcontext/methylarginine/">https://shechterlab.github.io/ptmcontext/methylarginine/</a>.</p>
  <p>All PTMcontext explorers: <a href="https://shechterlab.github.io/ptmcontext/">https://shechterlab.github.io/ptmcontext/</a></p>
</body>
</html>
